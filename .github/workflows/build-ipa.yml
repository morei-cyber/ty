
name: Build unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check files
        run: |
          echo "=== Current directory ==="
          pwd

          echo "=== Root files ==="
          ls -la

          echo "=== File tree ==="
          find . -maxdepth 4 -print

          echo "=== Check required paths ==="
          test -d Sources && echo "Sources exists" || echo "Sources MISSING"
          test -f Sources/MyiPadApp.swift && echo "Swift file exists" || echo "Swift file MISSING"
          test -d Resources && echo "Resources exists" || echo "Resources MISSING"
          test -f Resources/index.html && echo "HTML file exists" || echo "HTML file MISSING"
          test -f project.yml && echo "project.yml exists" || echo "project.yml MISSING"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build app
        run: |
          xcodebuild \
            -project MyiPadApp.xcodeproj \
            -scheme MyiPadApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MyiPadApp.app Payload/
          zip -r MyiPadApp.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: My-iPad-App-unsigned-IPA
          path: MyiPadApp.ipa
          retention-days: 7
